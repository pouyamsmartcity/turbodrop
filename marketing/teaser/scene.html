<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Vaz; src: url(assets/vazirmatn.woff2) format('woff2'); font-weight: 100 900; }
:root { --a1: #22d3ee; --a2: #6366f1; --a3: #d946ef; --ok: #34d399; --bad: #fb7185; --gold: #c9b27c; }
html, body { margin: 0; background: #000; overflow: hidden; }
#stage { position: relative; overflow: hidden; background: #05060d; color: #fff; font-family: 'Inter Display', Inter, sans-serif; }
html.fa #stage { font-family: Vaz, 'Inter Display', sans-serif; }
#bg, #content, #flash, #grain, #vig { position: absolute; inset: 0; }
#content { transform-origin: 50% 50%; }
#grain { opacity: .07; mix-blend-mode: overlay; pointer-events: none; }
#vig { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }
#streak { position: absolute; top: -20%; left: 0; width: 22%; height: 140%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(165,243,252,.55), rgba(255,255,255,.95), rgba(240,171,252,.55), rgba(255,255,255,0)); filter: blur(18px); mix-blend-mode: screen; }
.el { position: absolute; left: 0; top: 0; white-space: nowrap; }
.big { font-weight: 900; letter-spacing: -0.035em; line-height: .92; }
html.fa .big { letter-spacing: 0; line-height: 1.25; }
.grad { background: linear-gradient(100deg, #22d3ee, #818cf8 45%, #e879f9); -webkit-background-clip: text; background-clip: text; color: transparent; }
.gold { color: var(--gold); }
.muted { color: #a3adc8; }
.chip { display: inline-flex; align-items: center; gap: .45em; padding: .45em 1em; border-radius: 999px; border: 2px solid rgba(255,255,255,.16); background: rgba(14,18,36,.78); font-weight: 700; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.chip i { width: .7em; height: .7em; border-radius: 50%; background: var(--ok); display: inline-block; box-shadow: 0 0 12px var(--ok); }
.panel { border-radius: 28px; background: linear-gradient(160deg, rgba(23,29,58,.92), rgba(9,11,24,.92)); border: 2px solid rgba(255,255,255,.1); box-shadow: 0 30px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); }
.team { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15em; font-weight: 900; }
.beam { width: 40%; height: 160%; background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(165,180,252,.08) 60%, rgba(255,255,255,0)); filter: blur(10px); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); mix-blend-mode: screen; }
.phone { border-radius: 9% / 4.3%; border: 10px solid #0b0d16; background: #000; overflow: hidden; box-shadow: 0 0 0 2px rgba(255,255,255,.18), 0 40px 120px rgba(0,0,0,.6), 0 0 80px rgba(99,102,241,.35); }
.phone img, .win img { display: block; width: 100%; height: 100%; object-fit: cover; }
.win { border-radius: 18px; overflow: hidden; border: 2px solid rgba(255,255,255,.14); box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 70px rgba(34,211,238,.25); background: #0b0d16; }
.win .bar { height: 34px; background: #11152a; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.win .bar b { width: 12px; height: 12px; border-radius: 50%; background: #3b4166; display: inline-block; }
.term { font-family: 'JetBrains Mono', monospace; direction: ltr; text-align: left; white-space: pre; line-height: 1.35; }
.strike { position: absolute; left: -4%; top: 52%; width: 108%; height: .12em; background: var(--bad); border-radius: 99px; box-shadow: 0 0 20px var(--bad); transform-origin: left center; }
html.fa .strike { transform-origin: right center; left: auto; right: -4%; }
.ring { border-radius: 50%; border: 6px solid rgba(165,180,252,.8); box-shadow: 0 0 40px rgba(99,102,241,.8), inset 0 0 40px rgba(217,70,239,.5); }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3em; font-weight: 800; }
.tile svg { width: 1.6em; height: 1.6em; }
.bar-outer { border-radius: 999px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.12); overflow: hidden; }
.bar-inner { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #22d3ee, #6366f1, #d946ef); box-shadow: 0 0 30px rgba(99,102,241,.8); }
.score { display: flex; align-items: center; font-weight: 900; }
.score .n { background: #fff; color: #05060d; border-radius: .18em; padding: 0 .28em; margin: 0 .12em; }
.qr { background: #fff; padding: 3%; border-radius: 18px; }
.qr svg { display: block; width: 100%; height: 100%; }
.confetti { width: 18px; height: 30px; border-radius: 3px; }
.card { padding: 1.1em 1.3em; border-radius: 26px; box-sizing: border-box; }
.card h3 { margin: 0 0 .25em; font-size: 1.35em; font-weight: 900; }
.card p { margin: 0; color: #c7cde0; font-size: .82em; line-height: 1.45; white-space: normal; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <div id="content"></div>
  <div id="streak" style="display:none"></div>
  <div id="vig"></div>
  <div id="grain"></div>
  <div id="flash"></div>
</div>
<script src="qr.js"></script>
<script src="timing.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
</body>
</html>
