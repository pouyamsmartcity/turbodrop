<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Inter; src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #06080f; font-family: Inter, sans-serif; color: #eef2ff; }
  .bg { position: absolute; inset: 0; background:
      radial-gradient(520px 380px at 12% 18%, rgba(34,211,238,.28), transparent 70%),
      radial-gradient(560px 420px at 92% 10%, rgba(217,70,239,.25), transparent 70%),
      radial-gradient(700px 420px at 60% 110%, rgba(99,102,241,.35), transparent 70%); }
  .left { position: absolute; left: 70px; top: 92px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 34px; letter-spacing: -.02em; }
  h1 { font-size: 66px; line-height: 1.02; letter-spacing: -.045em; margin: 34px 0 20px; font-weight: 800; }
  .g { background: linear-gradient(135deg,#22d3ee,#6366f1 52%,#d946ef); -webkit-background-clip: text; color: transparent; }
  p { font-size: 25px; line-height: 1.45; color: #a3adc8; margin: 0; }
  .chips { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
  .chip { padding: 8px 16px; border-radius: 99px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); font-size: 18px; font-weight: 600; }
  .desk { position: absolute; left: 640px; top: 110px; width: 760px; border-radius: 16px; border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 40px 100px -20px rgba(99,102,241,.6); transform: perspective(1400px) rotateY(-14deg) rotateX(4deg); transform-origin: left center; }
  .phone { position: absolute; left: 1010px; top: 250px; width: 200px; border-radius: 30px; border: 5px solid #151a2c;
    box-shadow: 0 30px 80px -10px rgba(0,0,0,.8), 0 0 60px -10px rgba(34,211,238,.5); }
  .by { position: absolute; left: 70px; bottom: 44px; font-size: 18px; color: #6d7896; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="left">
    <div class="brand"><img src="../../web/public/favicon.svg" width="54" height="54" />Turbodrop</div>
    <h1>Like AirDrop,<br /><span class="g">for every device.</span></h1>
    <p>Windows ⇄ iPhone ⇄ Android ⇄ Mac ⇄ Linux.<br />The phone just scans a QR code — no app.</p>
    <div class="chips"><span class="chip">🔒 End-to-end encrypted</span><span class="chip">⏯ Resumable</span><span class="chip">Open source</span></div>
  </div>
  <img class="desk" src="../../docs/screenshots/desktop-home.png" />
  <img class="phone" src="../../docs/screenshots/phone-receive.png" />
  <div class="by">by Pouyam · pouyam.com</div>
</body>
</html>
